<style>
:root{--bg:#FFF6DC;--paper:#FFFFFF;--ink:#3B2618;--ink-2:#5E4A3B;--edge:#3B2618;--lingu:#FFD45C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Gothic A1","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:18px}
header{display:flex;align-items:center;gap:10px}
header img{width:40px;height:40px;border-radius:10px;border:2px solid var(--edge)}
h1{font-size:22px;margin:0;line-height:1.3}
section{background:var(--paper);border:2.5px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--edge);padding:14px;display:grid;gap:10px}
h2{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--lingu);border:2px solid var(--edge)}
video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
a.cta{display:flex;justify-content:center;align-items:center;min-height:52px;border-radius:999px;background:var(--lingu);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);color:var(--ink);font-weight:800;font-size:18px;text-decoration:none}
.wm{font-size:11px;text-align:center;color:rgba(59,38,24,.45)}
</style>

<main>
<header><img src="../assets/icon-180.png" alt=""><h1>링구 VOCA 사용법 영상</h1></header>

<video controls playsinline preload="metadata" poster="parent.jpg" src="parent.mp4"></video></section>
<section><h2><span class="tag">아이</span>링구랑 공부하는 법</h2>
<video controls playsinline preload="metadata" poster="student.jpg" src="student.mp4"></video></section>
<a class="cta" href="https://e.voca.linguaedu.online/">링구 VOCA 열기</a>

</main>
