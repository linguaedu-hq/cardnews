<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C2B50">
<title>링구아 카드뉴스</title>
<meta property="og:type" content="website">
<meta property="og:title" content="링구아 카드뉴스">
<meta property="og:description" content="링구아교육 2026년 10월 안내 카드뉴스 모음">
<meta property="og:url" content="https://linguaedu-hq.github.io/cardnews/">

<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#F4F6FB;--card:#FFFFFF;--ink:#1C2B50;--sub:#5A6480;--line:#DCE2EE;--gold:#F9BE3A;--shadow:0 10px 30px rgba(28,43,80,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1528;--card:#18213B;--ink:#EEF2FA;--sub:#A8B2CC;--line:#2A3556;--shadow:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F1528;--card:#18213B;--ink:#EEF2FA;--sub:#A8B2CC;--line:#2A3556;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
header{padding:8px 4px 18px}
.kick{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);background:var(--gold);border-radius:999px;padding:5px 12px}
h1{font-size:26px;line-height:1.3;margin:12px 0 6px}
header p{margin:0;color:var(--sub);font-size:15px;line-height:1.6}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
@media (min-width:640px){ul{grid-template-columns:1fr 1fr}}
a.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
a.item:active{transform:scale(.985)}
@media (hover:hover){a.item:hover{transform:translateY(-2px)}}
.thumb{aspect-ratio:1200/630;background:var(--line);display:block;width:100%;height:auto;object-fit:cover}
.meta{padding:14px 16px 16px;min-height:44px}
.meta b{display:block;font-size:17px;line-height:1.4}
.meta span{display:block;margin-top:4px;color:var(--sub);font-size:14px;line-height:1.5}
footer{margin-top:22px;color:var(--sub);font-size:12px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <span class="kick">링구아교육 · 2026년 10월</span>
    <h1>카드뉴스</h1>
    <p>눌러서 열고, 옆으로 넘겨 보세요.</p>
  </header>
  <ul>
    <li><a class="item" href="2610-consulting/"><img class="thumb" src="2610-consulting/og.png" alt="" decoding="async" loading="lazy"><div class="meta"><b>2027학년도 특목·자사고 입시 — 원서에서 합격까지</b><span>링구아교육컨설팅 · 13장</span></div></a></li>
    <li><a class="item" href="2610-middle/"><img class="thumb" src="2610-middle/og.png" alt="" decoding="async" loading="lazy"><div class="meta"><b>2026 중등 실적 — 내신 만점자 · 수능 모의고사</b><span>링구아어학원 중등부 · 9장</span></div></a></li>
    <li><a class="item" href="yurak-m1-l5/"><img class="thumb" src="yurak-m1-l5/og.png" alt="" decoding="async" loading="lazy"><div class="meta"><b>유락여중 중1 영어 5·6과 — 내신 대비</b><span>링구아어학원 · 24장</span></div></a></li>
  </ul>
  <footer>문의 | 링구아어학원</footer>
</main>
</body>
</html>
