:root{--bg:#F3F5FA;--tile:#FFFFFF;--ink:#1C2B50;--sub:#55607D;--line:#DDE3EF;--stage:#E2E8F4;--field:#F3F5FA;--navy:#1C2B50;--on-navy:#FFFFFF;
 --on-navy-sub:#D3DAEA;--gold:#F9BE3A;--cta:#1C2B50;--on-cta:#FFFFFF;--focus:#1C2B50;--cover-shadow:rgba(20,31,62,.30);
 --shadow:0 1px 0 rgba(28,43,80,.04),0 18px 36px -22px rgba(28,43,80,.34);--shadow-up:0 1px 0 rgba(28,43,80,.04),0 26px 44px -22px rgba(28,43,80,.44);
 --cnt:var(--gold);--green:#477449;--green-bg:#EDF4EA;--ease:cubic-bezier(.16,1,.3,1);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1020;--tile:#151D36;--ink:#EEF2FA;--sub:#A9B3CD;--line:#27314F;
 --stage:#44537F;--field:#0F1630;--cta:#EEF2FA;--on-cta:#1C2B50;--focus:#F9BE3A;--cover-shadow:rgba(3,6,16,.55);
 --shadow:0 0 0 1px #27314F;--shadow-up:0 0 0 1px #3A4670;--cnt:#1C2B50;--green:#7DB880;--green-bg:#1F3A2A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--tile:#151D36;--ink:#EEF2FA;--sub:#A9B3CD;--line:#27314F;--stage:#44537F;--field:#0F1630;--cta:#EEF2FA;
 --on-cta:#1C2B50;--focus:#F9BE3A;--cover-shadow:rgba(3,6,16,.55);--shadow:0 0 0 1px #27314F;--shadow-up:0 0 0 1px #3A4670;--cnt:#1C2B50;--green:#7DB880;--green-bg:#1F3A2A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Paperlogy","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-weight:500;font-size:16px;line-height:1.55;
 word-break:keep-all;-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:#1C2B50}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{width:min(1240px,100%);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.top{background:var(--navy);color:var(--on-navy);padding:max(20px,env(safe-area-inset-top)) 0 60px}
.top :focus-visible{outline-color:var(--gold)}
.brand{margin:0;font-size:15px;font-weight:700;color:var(--on-navy-sub)}
h1{margin:2px 0 4px;font-size:34px;line-height:1.15;font-weight:900;letter-spacing:-.01em}
.lead{margin:0;font-size:15px;color:var(--on-navy-sub);max-width:34em}

:root{--g1:#0B7A60;--g2:#2C63D6;--g3:#7444CF;--on-g:#FFFFFF;--tb:#8A5A00;--tb-bg:#FFF2D6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g1:#4FD1A8;--g2:#8FB0FF;--g3:#BFA6FF;--on-g:#0B1020;--tb:#F3C46B;--tb-bg:#3A2E12}}
:root[data-theme="dark"]{--g1:#4FD1A8;--g2:#8FB0FF;--g3:#BFA6FF;--on-g:#0B1020;--tb:#F3C46B;--tb-bg:#3A2E12}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:0 0 6px;font-size:14px;color:var(--on-navy-sub)}
.crumb a{display:inline-block;padding:12px 0;font-weight:700;color:var(--on-navy)}
.tagrow{margin:10px 0 8px}
.tag{display:inline-block;font-size:14px;font-weight:700;line-height:1.5;color:#1C2B50;background:var(--gold);border-radius:999px;padding:2px 11px;
 white-space:nowrap;vertical-align:.1em}
.brand .tag{margin-left:6px}

.sheet{margin-top:-44px;padding-bottom:8px}
.panel{background:var(--tile);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.find{margin:0}
.find input{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);
 font-family:inherit;font-size:17px;font-weight:700;-webkit-appearance:none;appearance:none}
.find input::placeholder{color:var(--sub);opacity:1;font-weight:500}
.find input:focus-visible{outline-offset:0;border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:14px 0 0;font-size:15px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;padding:0 8px;border-radius:8px;font-style:normal;
 font-size:14px;font-weight:700;color:var(--on-g)}
.gc.g1{background:var(--g1)}.gc.g2{background:var(--g2)}.gc.g3{background:var(--g3)}
.gc.soon{background:transparent;border:1.5px dashed currentColor;color:var(--sub)}
.cho{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--sub)}
.cho::after{content:"";flex:1;height:1px;background:var(--line)}
ul.schools{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
a.school{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:10px 14px;border-radius:14px;
 background:var(--field);border:1.5px solid var(--line);transition:transform .25s var(--ease),border-color .25s var(--ease)}
a.school b{font-size:17px;font-weight:700;min-width:0}
a.school .gcs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
a.school:active{transform:scale(.985)}
.none{margin:16px 0 0;font-size:15px;color:var(--sub)}

ul.grades{list-style:none;margin:0;padding:0;display:grid;gap:14px}
ul.grades > li{display:grid;min-width:0}
.grade{position:relative;display:grid;gap:10px;align-content:start;background:var(--tile);border-radius:22px;padding:18px;box-shadow:var(--shadow);
 min-width:0;--gcol:var(--g1)}
.grade.g2{--gcol:var(--g2)}.grade.g3{--gcol:var(--g3)}
a.grade{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
a.grade:active{transform:scale(.985)}
.ghead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.gno{font-size:40px;line-height:1;font-weight:900;letter-spacing:-.02em;color:var(--gcol)}
.tbchip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:700;color:var(--tb);background:var(--tb-bg)}
.grade b{display:block;font-size:20px;line-height:1.35;font-weight:700}
.grade .when{margin:0;font-size:15px;color:var(--sub)}
.gstage{overflow:hidden;border-radius:14px;background:var(--stage)}
.gstage img{display:block;width:100%;height:auto;aspect-ratio:1200/630;transition:transform .5s var(--ease)}
.gfoot{display:flex;justify-content:flex-end;min-height:28px;align-items:center}
.go{font-size:16px;font-weight:700;white-space:nowrap}
.grade.soon{background:var(--tile);box-shadow:none;border:1.5px dashed var(--line)}
.grade.soon .gno{color:var(--sub)}
.gstage.wait{aspect-ratio:1200/630;background:var(--field);border:1.5px dashed var(--line)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gcol);margin-right:8px;vertical-align:.18em}

.more{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0 0}
.more a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;background:var(--tile);box-shadow:var(--shadow);
 font-size:15px;font-weight:700;transition:transform .25s var(--ease)}
footer{padding:26px 0 max(28px,env(safe-area-inset-bottom));text-align:center;color:var(--sub)}
footer p{margin:0;font-size:15px}
footer .copy{margin-top:4px;font-size:13px}

@media (hover:hover){
 a.grade:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
 a.grade:hover .gstage img{transform:scale(1.03)}
 a.school:hover{transform:translateY(-2px);border-color:var(--ink)}
 .more a:hover{transform:translateY(-2px)}
 .crumb a:hover{text-decoration:underline;text-underline-offset:4px}
}
@media (max-width:699.98px){.gstage.wait{display:none}}
@media (min-width:560px){ul.schools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:700px){
 .wrap{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
 .top{padding:max(26px,env(safe-area-inset-top)) 0 84px}
 h1{font-size:54px}
 .lead{font-size:17px}
 .sheet{margin-top:-56px}
 .panel{padding:28px}
 ul.grades{gap:18px}
 ul.grades.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
 ul.grades.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
 ul.grades.n1{max-width:620px}
 ul.grades > li{grid-row:span 5;grid-template-rows:subgrid}
 .grade{grid-row:1/-1;grid-template-rows:subgrid;gap:10px;padding:20px}
 .gno{font-size:44px}
}
@media (min-width:900px){ul.schools{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.panel{padding:34px}ul.grades{gap:22px}.grade{padding:22px}}
@media (min-width:1200px){ul.schools{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion: no-preference){
 .panel,.grade{animation:rise .6s var(--ease) backwards}
 ul.grades > li:nth-child(2) .grade{animation-delay:.06s}ul.grades > li:nth-child(3) .grade{animation-delay:.12s}
 @keyframes rise{from{opacity:0;transform:translateY(16px)}}
}
@media (prefers-reduced-motion: reduce){
 a.grade,a.school,.more a,.gstage img{transition:none}
}
</style>
</head>
